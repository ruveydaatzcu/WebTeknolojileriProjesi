    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="brand-name" href="index.html">RÜVEYDA TUZCU</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>

                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; padding-top: 80px;">
        <section class="login-card p-5" data-aos="flip-left" style="background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 40px; border: 1px solid var(--border); max-width: 500px; width: 100%;">
            
            <div class="text-center mb-5">
                <i class="fas fa-user-shield fa-3x text-purple mb-3"></i>
                <h2 class="glitch-text">Sistem Erişimi</h2>
                <p class="small text-cyan" style="font-family: 'JetBrains Mono';">Sakarya Üniversitesi Kimlik Doğrulama</p>
            </div>

            <form action="login.php" method="POST" onsubmit="return validateLogin()">
                <div class="mb-4 text-start">
                    <label class="form-label small text-purple ms-2">E-POSTA</label>
                    <input type="email" id="email" name="email" class="form-control" 
                           placeholder="b251210070@sakarya.edu.tr" 
                           style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; border-radius: 15px; padding: 12px;">
                </div>
                <div class="mb-5 text-start">
                    <label class="form-label small text-purple ms-2">ŞİFRE</label>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Şifre (Öğrenci No)"
                           style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; border-radius: 15px; padding: 12px;">
                </div>
                <button type="submit" class="btn-cyber w-100 py-3 fw-bold" style="border: 1px solid var(--cyan); color: var(--cyan); background: transparent; border-radius: 15px; transition: 0.4s;">
                    OTURUMU AÇ
                </button>
            </form>
            
        </section>
    </main>

    <footer class="text-center py-5 text-muted small">
        <p>© 2026 Rüveyda Tuzcu // B251210070</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        function validateLogin() {
            var email = document.getElementById('email').value.trim();
            var pass = document.getElementById('password').value.trim();
            
            if (email === "" || pass === "") {
                alert("Hata: Kullanıcı adı ve şifre boş bırakılamaz!");
                return false;
            }
            
            // Mail formatı kontrolü (PDF kuralı)
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert("Hata: Geçerli bir e-posta adresi giriniz!");
                return false;
            }
            return true; 
        }

        particlesJS('particles-js', {
            particles: {
                number: { value: 50 },
                color: { value: '#bc13fe' },
                opacity: { value: 0.2 },
                size: { value: 3 },
                line_linked: { enable: true, color: '#bc13fe', opacity: 0.1 },
                move: { speed: 1 }
            }
        });
    </script>
</body>
</html>
