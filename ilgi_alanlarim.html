<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rüveyda Tuzcu // İlgi Alanlarım</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Sadece bu sayfaya özel API yükleme ve film kartı ince ayarları */
        .movie-card {
            background: var(--card-bg) !important;
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 30px;
            overflow: hidden;
            transition: all 0.4s ease;
            height: 100%;
        }
        .movie-card:hover { transform: scale(1.03); border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 242, 255, 0.2); }
        .movie-poster { height: 420px; width: 100%; object-fit: cover; border-bottom: 2px solid var(--border); }
        .imdb-rating { color: #f1c40f; font-weight: bold; font-family: 'JetBrains Mono'; }
        .loading-text { font-family: 'JetBrains Mono'; color: var(--cyan); letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="brand-name" href="index.html">RÜVEYDA TUZCU</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="ozgecmis.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="miras.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ilgi_alanlarim.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link login-btn ms-lg-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="header-bg text-center">
        <div class="container" data-aos="zoom-in">
            <h1 class="display-3 fw-bold glitch-text">Favori Filmlerim</h1>
            <p class="lead loading-text">OMDb API ile Senkronize Sinematik Seçkiler</p>
        </div>
    </header>

    <main class="container pb-5 mb-5">
        <div id="movie-container" class="row g-4 justify-content-center">
            <div class="text-center w-100 py-5" id="loader">
                <div class="spinner-border" style="color: var(--accent); width: 3rem; height: 3rem;" role="status"></div>
                <p class="mt-3 loading-text">VERİLER ÇEKİLİYOR...</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-5 text-muted small">
        <p style="letter-spacing: 2px;">© 2026 RÜVEYDA TUZCU // B251210070</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.css"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
        
        particlesJS('particles-js', {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: '#bc13fe' },
                opacity: { value: 0.2 },
                size: { value: 2.5, random: true },
                line_linked: { enable: true, distance: 150, color: '#bc13fe', opacity: 0.1, width: 1 },
                move: { speed: 1 }
            }
        });

        // --- API ENTEGRASYONU ---
        const apiKey = "16ec730"; 
        const favoriteMovies = [
            "Interstellar", "Inception", "The Matrix", 
            "The Prestige", "Shutter Island", "Blade Runner 2049", 
            "The Dark Knight", "Oppenheimer", "Fight Club"
        ];

        async function fetchMovies() {
            const container = document.getElementById('movie-container');
            let movieHTML = ''; 

            for (const title of favoriteMovies) {
                try {
                    const response = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${apiKey}`);
                    const data = await response.json();

                    if (data.Response === "True") {
                        movieHTML += `
                            <div class="col-md-6 col-lg-4" data-aos="fade-up">
                                <article class="movie-card">
                                    <img src="${data.Poster !== "N/A" ? data.Poster : 'https://via.placeholder.com/400x600'}" class="movie-poster" alt="${data.Title}">
                                    <div class="card-body p-4">
                                        <h5 class="text-purple fw-bold mb-3">${data.Title}</h5>
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <span class="imdb-rating"><i class="fas fa-star me-1"></i> ${data.imdbRating}</span>
                                            <span class="badge bg-dark border border-info">${data.Year}</span>
                                        </div>
                                        <p class="text-muted small" style="text-align: justify;">${data.Plot !== "N/A" ? data.Plot.substring(0, 120) : 'Film özeti yüklenemedi.'}...</p>
                                    </div>
                                </article>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error("API Hatası:", error);
                }
            }
            container.innerHTML = movieHTML;
        }

        fetchMovies();
    </script>
</body>
</html>
